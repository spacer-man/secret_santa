networks:
  main_network:
    driver: bridge


services:
  db:
    image: postgres:17.4
    container_name: secret_santa_db
    hostname: db
    restart: always

    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      PGPORT: 5432

    volumes:
      - ./db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${PGPORT}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - main_network

  bot:
    image: secret_santa_bot
    container_name: secret_santa_bot
    restart: always
    build:
      context: ./bot
      dockerfile: Dockerfile
    depends_on:
      state_storage:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}

      STATE_STORAGE_REDIS_URL: redis://:${STATE_STORAGE_PASSWORD}@state_storage:6379/0

      BOT_TOKEN: ${BOT_TOKEN}

      WISH_VALIDATE_TG_IDS: ${WISH_VALIDATE_TG_IDS}
      AUTHOR_SUPPORT_LINK: ${AUTHOR_SUPPORT_LINK}
    volumes:
      - ./bot/logs:/app/logs
    networks:
      - main_network

  state_storage:
    image: redis:latest
    container_name: secret_santa_state_storage
    hostname: state_storage
    restart: always
    environment:
      REDIS_PASSWORD: ${STATE_STORAGE_PASSWORD}
    expose:
      - "6379"
    volumes:
      - ./bot/state_data:/data
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "requirepass $${REDIS_PASSWORD}" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        redis-server /usr/local/etc/redis/redis.conf
      '
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main_network
